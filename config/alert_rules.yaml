alerts:
  - name: high_response_latency
    severity: warning
    condition: p95(latency_ms) > 3000
    duration: 5m
    type: symptom-based
    channel: slack
    owner: oncall-llmops
    runbook: docs/alerts.md#alert-1
  - name: elevated_error_rate
    severity: critical
    condition: error_rate > 2%
    duration: 3m
    type: symptom-based
    channel: slack
    owner: oncall-llmops
    runbook: docs/alerts.md#alert-2
  - name: retrieval_degradation
    severity: warning
    condition: retrieval_success_rate < 90%
    duration: 5m
    type: symptom-based
    channel: slack
    owner: oncall-rag
    runbook: docs/alerts.md#alert-3
